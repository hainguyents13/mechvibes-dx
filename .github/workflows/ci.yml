name: CI

# Verifies the crate compiles and its tests pass on every OS we ship for. The
# platform-specific code sits behind `#[cfg(target_os = ...)]` gates, so a cfg
# typo, a module that only compiles on one OS, or a `use` that only resolves on
# another would otherwise ship silently.
#
# The job is a thin wrapper: scripts/ci-check.sh does the work, and it is the
# same script you run locally. It also verifies that the Rust in use is at least
# the `rust-version` in Cargo.toml. The only things set up here are what a script
# cannot do for itself: the cache and the OS's system libraries.
#
# Tags are deliberately not a trigger: release.yml owns tag builds, and
# duplicating them here would double the work on every release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR. A quick follow-up push cancels the previous run
# instead of leaving two builds racing for the same answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only bloat the cache on a runner that is thrown away.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.name }} (check + test)
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish: a failure on one is information about the others.
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Windows needs none (the webview ships with the OS and the input path
      # uses winapi) and neither does macOS (system frameworks).
      - name: Install system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-system-deps

      - name: Verify toolchain, check and test
        run: bash scripts/ci-check.sh
