name: Release

# Pushing a `vX.Y.Z` tag builds every platform's package and drafts one release.
#
# Each build leg is a thin wrapper around the same script you run locally
# (scripts/build-*.sh|ps1). The scripts check that the Rust in use is at least
# `rust-version` from Cargo.toml, build with `--locked`, package, and check what
# they produced, so this file only installs what a script cannot (the cache, the
# OS's system libraries, packaging tools) and uploads the result.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only bloat the cache on a runner that is thrown away.
  CARGO_INCREMENTAL: 0

# `gate` checks the tag and extracts the changelog notes, then the `build`
# matrix runs one leg per OS in parallel, each uploading its artifacts. A single
# `release` job then downloads everything and creates one draft release. The
# alternative - letting every job call action-gh-release against the same tag -
# races: concurrent runs read the draft, append their own asset, and write back,
# so the last writer can drop the others' files. One writer, no race.
jobs:
  gate:
    name: Version and changelog gate
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version_gate.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gate - tag must match Cargo.toml version
        id: version_gate
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $cargoToml = [IO.File]::ReadAllText("Cargo.toml", [Text.Encoding]::UTF8)
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            Write-Error "Could not find version in Cargo.toml"
            exit 1
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            Write-Error "Tag version ($tagVersion) does not match Cargo.toml version ($cargoVersion)"
            exit 1
          }
          Write-Host "Tag version matches Cargo.toml version: $tagVersion"
          "app_version=$tagVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Gate - extract changelog notes
        shell: pwsh
        run: |
          # Capture output and exit code from the script invocation directly
          # rather than relying on $LASTEXITCODE after a pipe - a .ps1 (not
          # a native exe) doesn't reliably set $LASTEXITCODE when piped, and
          # $null -ne 0 is $true in PowerShell, so that pattern silently
          # always looks like failure.
          $notes = & .\scripts\extract-changelog.ps1 -Version "${{ steps.version_gate.outputs.app_version }}"
          $scriptSucceeded = $?
          if (-not $scriptSucceeded) {
            Write-Error "Failed to extract CHANGELOG.md section for ${{ steps.version_gate.outputs.app_version }}"
            exit 1
          }
          $notes | Out-File -FilePath notes.md -Encoding utf8
          Write-Host "Extracted release notes for ${{ steps.version_gate.outputs.app_version }}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every leg finish so one failure still shows the state of the rest.
      # The release job requires all of them, so a failed leg stops the release.
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            shell: pwsh
            package: .\scripts\build-windows-installer.ps1
            artifact: windows-release
            # The installer only. The version and notes come from `gate`.
            paths: dist/MechvibesDX-*-Setup-x64.exe
          - name: Linux packages
            os: ubuntu-latest
            shell: bash
            # Produces the .deb and the AppImage from one binary.
            package: ./scripts/build-linux-appimage.sh "$VERSION"
            artifact: linux-release
            paths: dist/*
          - name: macOS DMG
            os: macos-latest
            shell: bash
            package: ./scripts/build-macos-app.sh "$VERSION"
            artifact: macos-release
            paths: dist/*
    env:
      VERSION: ${{ needs.gate.outputs.app_version }}
    # A step's own `shell:` cannot read the matrix, but a job default can. Steps
    # that need a specific shell regardless of OS set it explicitly.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # --- tools and libraries a script cannot install for itself -------------
      - name: Install system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-system-deps

      # build-linux-appimage.sh builds the .deb through this.
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # build-windows-installer.ps1 compiles the installer with it.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y

      # --- the same steps as a local build ------------------------------------
      # Compile and test in the release profile first, so a broken tag fails
      # before anything is packaged and the package build reuses these
      # artifacts. No `clippy -D warnings` on purpose - the repo has pre-existing
      # clippy warnings unrelated to release correctness; gating on them would
      # make every release red until that debt is paid down separately.
      - name: Verify toolchain, check and test (release profile)
        shell: bash
        run: bash scripts/ci-check.sh --release

      # Builds the release binary (`--locked`), packages it and checks the
      # result: the AppImage and DMG are unpacked/mounted and walked, the
      # installer name is asserted against the auto-updater's filter.
      - name: Build and package
        run: ${{ matrix.package }}

      # Informational only, and deliberately NOT gated on: a GUI app on a
      # headless runner with no audio or input device is expected to be
      # unhappy, so what matters is WHICH way it fails. Verified on 260804
      # (run 30909285529): the app reaches soundpack scanning, resolves every
      # bundled pack out of the mounted image, and writes its config to
      # ~/.local/share/mechvibes - which is the whole point of the path work.
      - name: Headless smoke (informational, never gates)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          APPIMAGE=$(ls dist/*.AppImage)
          timeout 20s env APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE" 2>&1 | head -40 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Draft release
    runs-on: ubuntu-latest
    # Every platform must build before anything is published: a release that
    # silently lacks one platform's asset is worse than one that does not go
    # out. (The default `success()` condition applies.)
    needs: [gate, build]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release
          # notes.md is the release body, not an asset.
          find artifacts -type f ! -name notes.md -exec cp {} release/ \;
          cp artifacts/release-notes/notes.md notes.md

          if ! ls release/MechvibesDX-*-Setup-x64.exe >/dev/null 2>&1; then
            echo "::error::Windows installer missing from collected assets"
            exit 1
          fi

          # Record which platforms actually made it, so the release body can
          # say so instead of leaving a maintainer to diff the asset list.
          {
            echo ""
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- **Windows**: \`MechvibesDX-<version>-Setup-x64.exe\` — installer, the only asset the in-app updater uses."
          } >> notes.md
          if ls release/*.deb >/dev/null 2>&1; then
            {
              echo "- **Linux (Debian/Ubuntu)**: \`.deb\` — install with \`sudo dpkg -i\`. It does **not** add you to the \`input\` group; run \`sudo usermod -a -G input \$USER\` and log out/in, or key events won't be seen."
            } >> notes.md
          fi
          if ls release/*.AppImage >/dev/null 2>&1; then
            {
              echo "- **Linux (any distro)**: \`.AppImage\` is portable, with no install step. Run \`chmod +x\` on it first, then launch it. The \`input\` group requirement is the same as the \`.deb\` and nothing sets it up for you: \`sudo usermod -a -G input \$USER\`, then log out and back in, or key events won't be seen."
            } >> notes.md
          fi
          if ls release/*macos*.dmg >/dev/null 2>&1; then
            echo "- **macOS (experimental, untested)**: \`.dmg\` — open it and drag **MechvibesDX** to Applications. Ad-hoc signed but **not notarized**, and never run on a real Mac, so Gatekeeper blocks a normal double-click: right-click the app → **Open** → confirm, once. See \`README-macos.txt\`. Treat as a preview." >> notes.md
          fi

          echo "Assets to publish:"
          ls -la release/

      # The in-app auto-updater downloads this file from the release, finds
      # the line for the installer it is about to run, and refuses to execute
      # anything whose digest does not match. Generated here, in the single
      # writer job, so it covers exactly the assets that actually ship.
      #
      # Names are stored bare (no directory), which is what the updater's
      # parser expects. Releases published before this step existed have no
      # SHA256SUMS.txt at all; the app treats that as "verification
      # unavailable" and falls back to the manual download button.
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "Checksums covering $(($(wc -l < SHA256SUMS.txt))) assets:"
          cat SHA256SUMS.txt

      # A sums file that misses the installer would silently disable
      # verification for every user, so assert coverage rather than trust it.
      - name: Verify checksums cover the Windows installer
        run: |
          set -euo pipefail
          installer=$(cd release && ls MechvibesDX-*-Setup-x64.exe)
          if ! grep -q " [*]\?${installer}\$" release/SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt has no entry for ${installer}"
            exit 1
          fi
          echo "SHA256SUMS.txt covers ${installer}"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # Plain "vX.Y.Z" title by user preference (260803) - the repo name
          # already says what the project is.
          name: "v${{ needs.gate.outputs.app_version }}"
          body_path: notes.md
          files: release/*
